name: Post removal records
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  issues: write
  contents: read
concurrency:
  group: post-records
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post new removal records as issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/sync_records.py
